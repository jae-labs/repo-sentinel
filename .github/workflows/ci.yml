name: Test scanner
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install 'bandit[sarif]==1.9.4'
      - run: python3 -m unittest discover -s tests -v
      - name: Validate inventories
        run: |
          for inventory in inventories/*.json; do
            python3 -m sentinel inventory "$inventory"
          done
