name: Reusable repository scan
on:
  workflow_call:
    inputs:
      inventory:
        required: true
        type: string
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      has_targets: ${{ steps.targets.outputs.has_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: targets
        env:
          INVENTORY: ${{ inputs.inventory }}
        run: python3 -m sentinel inventory "$INVENTORY"
  scan:
    needs: inventory
    if: needs.inventory.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        target: ${{ fromJSON(needs.inventory.outputs.targets) }}
    name: Scan ${{ matrix.target.repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clone and resolve requested version
        timeout-minutes: 15
        id: clone
        env:
          TARGET_REPO: ${{ matrix.target.repo }}
          TARGET_VERSION: ${{ matrix.target.version }}
        run: python3 -m sentinel clone
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.2
          cache: 'false'
      - name: Scan dependencies and configuration
        id: trivy
        shell: bash
        run: |
          set +e
          trivy fs --timeout 20m --skip-files '**/*.dockerignore' --scanners vuln,misconfig --severity HIGH,CRITICAL --format json --output results.json --exit-code 0 --no-progress target 2>scan.log
          scan_exit=$?
          cat scan.log
          exit "$scan_exit"
      - name: Scan explicitly configured container image
        id: image
        if: ${{ always() && steps.clone.outcome == 'success' && matrix.target.image != '' }}
        env:
          IMAGE_REF: ${{ matrix.target.image }}
          IMAGE_PLATFORM: ${{ matrix.target.platform }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$IMAGE_PLATFORM" ]]; then args+=(--platform "$IMAGE_PLATFORM"); fi
          trivy image --timeout 20m --image-src remote --scanners vuln --severity HIGH,CRITICAL --format json --output image-results.json --exit-code 0 --no-progress "${args[@]}" "$IMAGE_REF" 2>image-scan.log
      - name: Install Semgrep
        id: semgrep_install
        if: ${{ always() && steps.clone.outcome == 'success' }}
        run: python3 -m pip install 'semgrep==1.185.0'
      - name: Scan source code with Semgrep
        id: semgrep
        if: ${{ always() && steps.clone.outcome == 'success' && steps.semgrep_install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/semgrep-raw.json"
          log="$RUNNER_TEMP/semgrep.log"
          sarif="$RUNNER_TEMP/semgrep-raw.sarif"
          trap 'rm -f "$raw" "$log" "$sarif"' EXIT
          if ! timeout 20m semgrep scan --config p/security-audit --disable-nosem --metrics=off --disable-version-check --no-git-ignore --json --output "$raw" --sarif-output "$sarif" target 2>"$log"; then
            echo 'Semgrep failed; scanner output withheld because it may contain source text.' >&2
            exit 1
          fi
          python3 -m sentinel normalize semgrep "$raw" semgrep.json
          if ! python3 -m sentinel sanitize-sarif "$sarif" semgrep.sarif; then
            echo '::warning::Semgrep SARIF unavailable or invalid.'
          fi
      - name: Install OSV-Scanner
        if: ${{ always() && steps.clone.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo 'fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  '"$RUNNER_TEMP/osv-scanner" | sha256sum --check
          chmod +x "$RUNNER_TEMP/osv-scanner"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install Bandit
        if: ${{ always() && steps.clone.outcome == 'success' }}
        run: python3 -m pip install 'bandit[sarif]==1.9.4'
      - name: Install Hadolint
        if: ${{ always() && steps.clone.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo 'c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  '"$RUNNER_TEMP/hadolint" | sha256sum --check
          chmod +x "$RUNNER_TEMP/hadolint"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan detected languages and Dockerfiles
        timeout-minutes: 45
        id: specialized
        if: ${{ always() && steps.clone.outcome == 'success' }}
        run: python3 -m sentinel specialized target
      - name: Generate sanitized SARIF artifacts
        if: ${{ always() && steps.clone.outcome == 'success' }}
        timeout-minutes: 45
        shell: bash
        run: |
          set -u
          raw="$RUNNER_TEMP/native-results.sarif"
          config="$RUNNER_TEMP/osv-empty.toml"
          trap 'rm -f "$raw" "$config"' EXIT
          for report in results image-results; do
            if [[ -s "$report.json" ]]; then
              rm -f "$raw"
              if trivy convert --format sarif --output "$raw" "$report.json" && python3 -m sentinel sanitize-sarif "$raw" "$report.sarif"; then
                :
              else
                echo "::warning::SARIF conversion failed for $report."
              fi
            fi
          done
          rm -f "$raw"
          : > "$config"
          if command -v osv-scanner >/dev/null; then
            env CGO_ENABLED=0 GOWORK=off GOTOOLCHAIN=local GOFLAGS=-mod=readonly GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org timeout 20m osv-scanner scan source -r --no-ignore --config "$config" --format sarif target > "$raw" 2>/dev/null
            code=$?
            if [[ "$code" == 0 || "$code" == 1 ]]; then
              python3 -m sentinel sanitize-sarif "$raw" osv.sarif || echo '::warning::OSV SARIF unavailable or invalid.'
            elif [[ "$code" != 128 ]]; then
              echo '::warning::OSV SARIF scan failed or timed out.'
            fi
          else
            echo '::warning::OSV SARIF scanner unavailable.'
          fi
          rm -f "$raw"
          if command -v bandit >/dev/null; then
            if timeout 20m bandit -r target --quiet --format sarif --output "$raw" --exit-zero --ignore-nosec >/dev/null 2>&1; then
              python3 -m sentinel sanitize-sarif "$raw" bandit.sarif || echo '::warning::Bandit SARIF unavailable or invalid.'
            else
              echo '::warning::Bandit SARIF scan failed or timed out.'
            fi
          else
            echo '::warning::Bandit SARIF scanner unavailable.'
          fi
      - name: Summarize findings
        if: always()
        env:
          TARGET_REPO: ${{ matrix.target.repo }}
          TARGET_VERSION: ${{ matrix.target.version }}
          SCAN_OUTCOME: ${{ steps.trivy.outcome }}
          CLONE_OUTCOME: ${{ steps.clone.outcome }}
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          SPECIALIZED_OUTCOME: ${{ steps.specialized.outcome }}
          IMAGE_OUTCOME: ${{ steps.image.outcome }}
          IMAGE_REF: ${{ matrix.target.image }}
          IMAGE_PLATFORM: ${{ matrix.target.platform }}
        run: python3 -m sentinel summary
      - name: Save full report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-${{ strategy.job-index }}
          path: |
            results.json
            revision.json
            status.json
            scan.log
            diagnostics.json
            semgrep.json
            specialized.json
            image-results.json
            image-scan.log
            results.sarif
            image-results.sarif
            semgrep.sarif
            osv.sarif
            bandit.sarif
          if-no-files-found: warn
          retention-days: 30
  summary:
    name: Combined scan summary
    needs: [inventory, scan]
    if: ${{ always() && needs.inventory.result == 'success' && needs.inventory.outputs.has_targets == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download scan reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scan-*
          path: scan-artifacts
          merge-multiple: false
      - name: Download CISA known exploited vulnerabilities catalog
        shell: bash
        run: |
          if ! curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 120 -o cisa-kev.json https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json; then
            echo 'CISA primary feed unavailable; trying its official GitHub mirror.'
            if ! curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 120 -o cisa-kev.json https://raw.githubusercontent.com/cisagov/kev-data/develop/known_exploited_vulnerabilities.json; then
              rm -f cisa-kev.json
              echo '::warning::CISA catalog download failed; exploitation status will be unknown.'
            fi
          fi
      - name: Combine reports
        env:
          INVENTORY: ${{ inputs.inventory }}
        run: python3 -m sentinel aggregate "$INVENTORY" scan-artifacts --cisa-catalog cisa-kev.json
      - name: Save combined report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: combined-report
          path: combined-report.md
          retention-days: 30
