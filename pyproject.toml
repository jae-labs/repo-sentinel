[project]
name = "repo-sentinel"
version = "0.1.0"
requires-python = ">=3.14"

[dependency-groups]
runtime = ["cvss==3.6"]
dev = [
    {include-group = "runtime"},
    "bandit[sarif]==1.9.4",
    "mypy==2.4.1",
    "ruff==0.17.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
files = ["sentinel"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["cvss", "cvss.*"]
ignore_missing_imports = true
